server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: yuanyu-safety
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/yuanyu;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:yuanyu-safety-jwt-secret-key-please-change-in-production-2026}
    expire-hours: 12
  internal-token: ${INTERNAL_TOKEN:yuanyu-internal-2026}
  ai-base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  privacy:
    # 工地地址在列表/浏览态脱敏，编辑详情仍返回完整地址（仅 ADMIN/MANAGER）
    mask-site-location: ${MASK_SITE_LOCATION:true}

logging:
  level:
    com.yuanyu.safety: info
    org.springframework.security: warn
